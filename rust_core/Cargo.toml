[package]
name = "mc_launcher_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "mc_launcher_core"
crate-type = ["cdylib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
zip = "0.6"
sha1 = "0.10"
futures-util = "0.3"
ash = "0.38"
