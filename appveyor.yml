version: 1.0.{build}

image: Ubuntu2204

environment:
  FLUTTER_VERSION: 3.27.4
  ANDROID_SDK_ROOT: $HOME/android-sdk
  ANDROID_HOME: $HOME/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
  NDK_VERSION: 27.0.12077973

install:
  # 安装基础依赖 (含 Java JDK，sdkmanager 和 Flutter Android 构建需要)
  - sh: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq curl unzip xz-utils zip libglu1-mesa openjdk-21-jdk glslang-tools
      java -version
      glslangValidator --version

  # 安装 Flutter (Linux, 用户目录避免权限问题)
  - sh: |
      FLUTTER_DIR="$HOME/flutter"
      if [ ! -d "$FLUTTER_DIR" ]; then
        mkdir -p "$FLUTTER_DIR"
        curl -L "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.27.4-stable.tar.xz" -o /tmp/flutter.tar.xz
        tar xf /tmp/flutter.tar.xz -C "$FLUTTER_DIR" --strip-components=1
      fi
      export PATH="$FLUTTER_DIR/bin:$PATH"
      git config --global --add safe.directory "$FLUTTER_DIR"
      flutter config --enable-android
      flutter doctor -v

  # 安装 Android SDK 命令行工具 (Linux)
  - sh: |
      SDK_DIR="$HOME/android-sdk"
      mkdir -p "$SDK_DIR/cmdline-tools"
      cd "$SDK_DIR/cmdline-tools"
      curl -L "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
      unzip -o /tmp/cmdline-tools.zip
      mv cmdline-tools latest 2>/dev/null || true
      export ANDROID_HOME="$SDK_DIR"
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      export PATH="$JAVA_HOME/bin:$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools:$PATH"
      yes | sdkmanager --licenses
      sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"

  # 安装 Rust 工具链 (Linux)
  - sh: |
      cd "$APPVEYOR_BUILD_FOLDER"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      export PATH="$HOME/.cargo/bin:$PATH"
      rustc --version
      cargo --version
      rustup target add aarch64-linux-android

build_script:
  # 编译 GLSL 着色器为 SPIR-V (供 Rust 端 include_bytes 嵌入)
  - sh: |
      cd "$APPVEYOR_BUILD_FOLDER"
      glslangValidator -V rust_core/src/shaders/vert.glsl -o rust_core/src/shaders/vert.spv
      glslangValidator -V rust_core/src/shaders/frag.glsl -o rust_core/src/shaders/frag.spv
      ls -l rust_core/src/shaders/*.spv

  # 构建 Rust 动态库（完全使用 Vulkan，CI 自动构建 .so）
  - sh: |
      cd "$APPVEYOR_BUILD_FOLDER"
      export PATH="$HOME/.cargo/bin:$PATH"
      export ANDROID_HOME="$HOME/android-sdk"
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
      export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
      cd rust_core
      cargo build --release --target aarch64-linux-android
      cd ..

  # 将构建好的 .so 复制到 Flutter assets
  - sh: |
      cd "$APPVEYOR_BUILD_FOLDER"
      mkdir -p assets/rust_lib
      cp rust_core/target/aarch64-linux-android/release/libmc_launcher_core.so assets/rust_lib/

  # 构建 Flutter APK（完全使用 Vulkan 3D 皮肤，无需预构建 .so）
  - sh: |
      cd "$APPVEYOR_BUILD_FOLDER"
      export PATH="$HOME/flutter/bin:$PATH"
      export ANDROID_HOME="$HOME/android-sdk"
      export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      export PATH="$JAVA_HOME/bin:$PATH"
      git config --global --add safe.directory "$HOME/flutter"
      flutter build apk --release --target-platform android-arm64

artifacts:
  - path: build/app/outputs/flutter-apk/app-release.apk
    name: Minecraft Launcher APK

deploy: off
